services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-relay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-relay_dev_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:-900}
      OUTBOX_PUBLISHER_NAME: ${OUTBOX_PUBLISHER_NAME:-relay-outbox-publisher}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_PUBLISHING_TIMEOUT_SECONDS: ${OUTBOX_PUBLISHING_TIMEOUT_SECONDS:-300}
      OUTBOX_BACKOFF_SECONDS: ${OUTBOX_BACKOFF_SECONDS:-5,30,120,300}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-relay-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=relay,deployment.environment=development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  relay-outbox-publisher:
    build:
      context: ./backend
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      OUTBOX_PUBLISHER_NAME: ${OUTBOX_PUBLISHER_NAME:-relay-outbox-publisher}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_PUBLISHING_TIMEOUT_SECONDS: ${OUTBOX_PUBLISHING_TIMEOUT_SECONDS:-300}
      OUTBOX_BACKOFF_SECONDS: ${OUTBOX_BACKOFF_SECONDS:-5,30,120,300}
      OUTBOX_METRICS_PORT: ${OUTBOX_METRICS_PORT:-9101}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: relay-outbox-publisher
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=relay,deployment.environment=development}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python", "-m", "app.workers.outbox_publisher"]
    expose:
      - "9101"

  relay-audit-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-audit-worker
      WORKER_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      WORKER_ROUTING_KEY: events.*,audit.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:-900}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: relay-audit-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=relay,deployment.environment=development}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python", "-m", "app.workers.audit_consumer"]
    expose:
      - "9102"

  relay-analytics-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-analytics-worker
      WORKER_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      WORKER_ROUTING_KEY: analytics.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:-900}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: relay-analytics-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=relay,deployment.environment=development}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python", "-m", "app.workers.analytics_consumer"]
    expose:
      - "9102"

  relay-notification-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-notification-worker
      WORKER_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      WORKER_ROUTING_KEY: notifications.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:-900}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: relay-notification-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=relay,deployment.environment=development}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python", "-m", "app.workers.notification_consumer"]
    expose:
      - "9102"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - backend
      - relay-outbox-publisher
      - relay-audit-worker
      - relay-analytics-worker
      - relay-notification-worker
      - rabbitmq-exporter
      - alertmanager
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:1.0.0
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_DEFAULT_USER:-relay}
      RABBIT_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-relay_dev_password}
      PUBLISH_PORT: "9419"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "9419:9419"

  tempo:
    image: grafana/tempo:2.7.2
    command: ["--config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    depends_on:
      - tempo
    volumes:
      - ./infra/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.4.2
    command: ["--config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.17.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-relay}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-relay_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
      - alertmanager
      - tempo
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  tempo-data:
  loki-data:
  alloy-data:
