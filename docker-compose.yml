services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-relay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-relay_dev_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  relay-audit-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-audit-worker
      WORKER_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      WORKER_ROUTING_KEY: events.*,audit.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.audit_consumer"]

  relay-analytics-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-analytics-worker
      WORKER_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      WORKER_ROUTING_KEY: analytics.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.analytics_consumer"]

  relay-notification-worker:
    build:
      context: ./backend
    environment:
      WORKER_NAME: relay-notification-worker
      WORKER_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      WORKER_ROUTING_KEY: notifications.*
      PROJECT_NAME: ${PROJECT_NAME:-Relay}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://relay:relay_dev_password@postgres:5432/relay}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-relay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-relay_dev_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-relay.events.dlx}
      RABBITMQ_AUDIT_QUEUE: ${RABBITMQ_AUDIT_QUEUE:-relay.events.audit}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-relay.events.analytics}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-relay.events.notifications}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-relay.events.dead_letter}
      RABBITMQ_RETRY_QUEUE_10S: ${RABBITMQ_RETRY_QUEUE_10S:-relay.events.retry.10s}
      RABBITMQ_RETRY_QUEUE_30S: ${RABBITMQ_RETRY_QUEUE_30S:-relay.events.retry.30s}
      RABBITMQ_RETRY_QUEUE_5M: ${RABBITMQ_RETRY_QUEUE_5M:-relay.events.retry.5m}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.notification_consumer"]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - backend
      - rabbitmq-exporter
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:1.0.0
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_DEFAULT_USER:-relay}
      RABBIT_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-relay_dev_password}
      PUBLISH_PORT: "9419"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "9419:9419"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-relay}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-relay_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  prometheus-data:
  grafana-data:
