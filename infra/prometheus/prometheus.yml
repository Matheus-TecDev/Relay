global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/relay-alerts.yml

scrape_configs:
  - job_name: relay-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: rabbitmq-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq-exporter:9419
