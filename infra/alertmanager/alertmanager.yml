global:
  resolve_timeout: 5m

route:
  receiver: webhook-info
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: webhook-critical
      matchers:
        - severity="critical"
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 1h
      continue: false

    - receiver: webhook-warning
      matchers:
        - severity="warning"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      continue: false

    - receiver: webhook-info
      matchers:
        - severity="info"
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: false

receivers:
  - name: webhook-critical
    webhook_configs:
      - url: http://host.docker.internal:8080/alerts/critical
        send_resolved: true
        max_alerts: 0

  - name: webhook-warning
    webhook_configs:
      - url: http://host.docker.internal:8080/alerts/warning
        send_resolved: true
        max_alerts: 0

  - name: webhook-info
    webhook_configs:
      - url: http://host.docker.internal:8080/alerts/info
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal:
      - alertname
      - service
